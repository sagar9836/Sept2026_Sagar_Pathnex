apiVersion: apps/v1
kind: Deployment
metadata: 
  name: pathnex-deployment
spec:
  replicas: 2
  selector:
    matchLabel: 
      app: pathnex-app
  template:
    metadata:
      labels: 
        app: pathnex-app
    spec:
      containers:
        - name: web
          image: nginx
          ports:
            - containerPort: 80
          
---
apiVersion: v1
kind: Service
metadata: 
  name: pathnex-service
spec: 
  selector:
    app: pathnex-app
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

