---
- name: Install Nginx and deploy HTML
  hosts: all
  become: yes

  tasks:
    - name: Install nginx
      yum: 
        name: nginx
        state: present
    
    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy HTML file
      copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html
        mode: "0644"



